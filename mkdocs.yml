site_name: Drone CV Detection
site_description: Multi-platform aerial computer vision — person detection & parking occupancy
site_url: https://rwiren.github.io/drone-cv-detection/
docs_dir: docs-site

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Platforms:
    - DJI M2EA: platforms/m2ea.md
    - Autel MAX 4T V2: platforms/autel.md
    - DJI Avata 360: platforms/avata360.md
  - Models & Training: models/training.md
  - Calibration: calibration/index.md
  - Research Papers:
    - Autel AI Verification: autel-verification.md
    - DJI Avata 360 Pipeline: avata360-analysis.md
  - Changelog: changelog.md
