[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "drone-cv-detection"
version = "1.4.0"
description = "Multi-platform aerial computer vision — person detection & parking occupancy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["drone", "UAV", "computer-vision", "YOLO", "detection", "aerial"]

dependencies = [
    "ultralytics>=8.2,<9",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<2.1",
    "sahi>=0.11,<1",
    "folium>=0.16,<1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
mqtt  = ["paho-mqtt>=2.0,<3"]
dev   = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.6",
]

[project.urls]
Homepage    = "https://github.com/rwiren/drone-cv-detection"
Docs        = "https://rwiren.github.io/drone-cv-detection/"
Changelog   = "https://github.com/rwiren/drone-cv-detection/blob/main/CHANGELOG.md"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit   = ["src/yolo_car_counter.py"]   # top-level script, not a module

[tool.coverage.report]
show_missing = true
